<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Kasfaimid</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --accent-glow: rgba(13, 148, 136, 0.25);
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --danger: #dc2626;
            --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: var(--shadow-lg);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%);
            color: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .login-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.825rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.icon-left {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease-in-out;
        }

        .form-control:hover {
            border-color: var(--border-hover);
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: var(--accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0d9488 0%, #115e59 100%);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.825rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1>Login sebagai Admin</h1>
            <p>Masukkan kredensial Anda untuk masuk ke sistem</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope icon-left"></i>
                    <input type="email" id="email" class="form-control" placeholder="admin@kasfaimid.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
            </button>
        </form>
    </div>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        // Konfigurasi Database (Menggunakan config yang sama dengan admin.html)
        const firebaseConfig = {
            apiKey: "AIzaSyDun1SSeSjVe8ztFl8P_TzBXhfUYk1K7FM",
            authDomain: "laporan-19814.firebaseapp.com",
            projectId: "laporan-19814",
            storageBucket: "laporan-19814.firebasestorage.app",
            messagingSenderId: "420276873621",
            appId: "1:420276873621:web:5f0daeb7d99961218fee9c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const alertBox = document.getElementById('alertBox');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        // Otomatis redirect ke halaman admin live jika sesi pengguna sudah aktif
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "https://admin.kasfaimid.my.id";
            }
        });

        // Toggle Lihat / Sembunyikan Password
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.classList.toggle('fa-eye', !isPassword);
            togglePassword.classList.toggle('fa-eye-slash', isPassword);
        });

        // Tampilkan Pesan Error
        function showError(message) {
            alertBox.innerText = message;
            alertBox.style.display = 'block';
        }

        // Proses Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Pengalihan halaman akan dipicu secara otomatis oleh listener onAuthStateChanged
            } catch (error) {
                let errorMsg = "Gagal masuk. Periksa email dan password Anda.";
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg = "Email atau password yang Anda masukkan salah.";
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = "Terlalu banyak percobaan gagal. Silakan coba lagi nanti.";
                }

                showError(errorMsg);
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
            }
        });
    </script>
</body>
</html>
